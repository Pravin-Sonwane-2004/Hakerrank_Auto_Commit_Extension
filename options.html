<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HackerRank GitHub Sync Settings</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f9fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #657186;
        --line: #dbe2ea;
        --green: #0f8f62;
        --red: #c93f42;
        --blue: #2368c6;
        --blue-dark: #1d57a5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 36px 20px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      header img {
        width: 42px;
        height: 42px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      form {
        display: grid;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        font: inherit;
      }

      input:focus {
        border-color: var(--blue);
        outline: 3px solid rgba(35, 104, 198, 0.16);
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding-top: 4px;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 7px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .primary {
        background: var(--blue);
        color: #fff;
      }

      .primary:hover:not(:disabled) {
        background: var(--blue-dark);
      }

      .secondary {
        background: var(--panel);
        border-color: var(--line);
        color: var(--ink);
      }

      #status {
        min-height: 22px;
        color: var(--muted);
      }

      #status.success {
        color: var(--green);
      }

      #status.error {
        color: var(--red);
      }

      .spinner {
        display: none;
        width: 14px;
        height: 14px;
        margin-left: 8px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
      }

      .loading .spinner {
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        main {
          padding: 22px 14px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" alt="">
        <div>
          <h1>Settings</h1>
          <div id="tokenState" class="hint"></div>
        </div>
      </header>

      <form id="settingsForm">
        <label>
          GitHub Token
          <input id="githubToken" type="password" autocomplete="off" spellcheck="false" placeholder="Paste a token to save or replace">
          <span class="hint">Stored in local extension storage and withheld from HackerRank content scripts.</span>
        </label>

        <div class="grid">
          <label>
            Repository Owner
            <input id="owner" type="text" autocomplete="off" spellcheck="false" placeholder="octocat" required>
          </label>

          <label>
            Repository Name
            <input id="repo" type="text" autocomplete="off" spellcheck="false" placeholder="coding-solutions" required>
          </label>
        </div>

        <label>
          Branch Name
          <input id="branch" type="text" autocomplete="off" spellcheck="false" placeholder="main" required>
        </label>

        <div class="actions">
          <button id="save" class="primary" type="submit">
            Save Settings
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <button id="test" class="secondary" type="button">Test Connection</button>
          <button id="clearToken" class="secondary" type="button">Clear Token</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>

    <script src="utils.js"></script>
    <script src="options.js"></script>
  </body>
</html>
