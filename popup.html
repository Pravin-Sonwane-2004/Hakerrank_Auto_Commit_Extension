<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HackerRank GitHub Sync</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f9fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #657186;
        --line: #dbe2ea;
        --green: #0f8f62;
        --red: #c93f42;
        --blue: #2368c6;
        --blue-dark: #1d57a5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      header img {
        width: 32px;
        height: 32px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      main {
        padding: 14px;
      }

      .status {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .status strong {
        display: block;
        margin-bottom: 4px;
      }

      .status.success strong {
        color: var(--green);
      }

      .status.failed strong {
        color: var(--red);
      }

      .status.skipped strong {
        color: #9a6400;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 8px;
        margin: 12px 0;
      }

      button {
        min-height: 38px;
        border: 1px solid transparent;
        border-radius: 7px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .primary {
        background: var(--blue);
        color: #fff;
      }

      .primary:hover:not(:disabled) {
        background: var(--blue-dark);
      }

      .icon-button,
      .secondary {
        background: var(--panel);
        color: var(--ink);
        border-color: var(--line);
      }

      .icon-button {
        display: grid;
        place-items: center;
        padding: 0;
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 12px 0 8px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 13px;
      }

      .history {
        display: grid;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
      }

      .entry {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .entry-title {
        margin: 0 0 3px;
        font-weight: 700;
        word-break: break-word;
      }

      .entry-path {
        margin: 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        word-break: break-word;
      }

      .empty {
        padding: 18px 10px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        text-align: center;
        color: var(--muted);
      }

      .spinner {
        display: none;
        width: 15px;
        height: 15px;
        margin-left: 8px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
      }

      .loading .spinner {
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="">
      <div>
        <h1>HackerRank GitHub Sync</h1>
        <div id="repoSummary" class="muted">Settings not configured</div>
      </div>
    </header>

    <main>
      <section id="statusCard" class="status">
        <strong id="statusTitle">Ready</strong>
        <div id="statusMessage" class="muted">Waiting for an accepted HackerRank submission.</div>
      </section>

      <div class="actions">
        <button id="syncCurrent" class="primary" type="button">
          Sync Current Page
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button id="openOptions" class="icon-button" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
            <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 1 1-2.97 2.97l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.08 1.65V21a2.1 2.1 0 1 1-4.2 0v-.06a1.8 1.8 0 0 0-1.08-1.65 1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 1 1-2.97-2.97l.04-.04A1.8 1.8 0 0 0 3.86 15a1.8 1.8 0 0 0-1.65-1.08H2.1a2.1 2.1 0 1 1 0-4.2h.06a1.8 1.8 0 0 0 1.65-1.08 1.8 1.8 0 0 0-.36-1.98l-.04-.04a2.1 2.1 0 1 1 2.97-2.97l.04.04a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 9.48 2.4V2.1a2.1 2.1 0 1 1 4.2 0v.06a1.8 1.8 0 0 0 1.08 1.65 1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 1 1 2.97 2.97l-.04.04a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.08h.06a2.1 2.1 0 1 1 0 4.2h-.06A1.8 1.8 0 0 0 19.4 15Z"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar">
        <h2>Recent Syncs</h2>
        <button id="clearHistory" class="secondary" type="button">Clear</button>
      </div>

      <section id="historyList" class="history"></section>
    </main>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
